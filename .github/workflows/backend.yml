name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PostgreSQL tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow
          POSTGRES_DB: campusflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      CAMPUSFLOW_DATABASE_URL: postgresql+psycopg://campusflow:campusflow@127.0.0.1:5432/campusflow_test
      CAMPUSFLOW_TEST_DATABASE_URL: postgresql+psycopg://campusflow:campusflow@127.0.0.1:5432/campusflow_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check database migrations
        run: uv run --locked alembic upgrade head

      - name: Run tests
        run: uv run --locked pytest

      - name: Run Ruff lint
        run: uv run --locked ruff check .

      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .
