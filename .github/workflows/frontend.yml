name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Locked install and type build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run type-checked production build
        run: npm run build

  e2e:
    name: Manual management browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow
          POSTGRES_DB: campusflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      CAMPUSFLOW_DATABASE_URL: postgresql+psycopg://campusflow:campusflow@127.0.0.1:5432/campusflow_test
      CAMPUSFLOW_TEST_DATABASE_URL: postgresql+psycopg://campusflow:campusflow@127.0.0.1:5432/campusflow_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: |
          cd backend
          uv sync --locked
          uv run --locked alembic upgrade head
          cd ../frontend
          npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: backend
        run: |
          uv run --locked uvicorn campusflow.main:app --host 127.0.0.1 --port 8000 > /tmp/campusflow-api.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/api/v1/health

      - name: Run browser flow
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/campusflow-api.log
          retention-days: 7
