name: Desktop release

# 独立于 v0.x 发布流程：只处理 desktop-v* 标签，不移动、不删除现有 tag/Release。
on:
  workflow_dispatch:
    inputs:
      note:
        description: 仅构建产物，不创建 Release（留空）
        required: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage bundled PostgreSQL 17 and pgvector
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash desktop/postgres/build_macos.sh

      - name: Build PyInstaller sidecar
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash desktop/build_macos.sh

      - name: Install Electron dependencies and compile
        working-directory: desktop/electron
        run: |
          npm ci
          npm run build

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::桌面正式发布缺少 secret：$name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Package DMG
        working-directory: desktop/electron
        env:
          # 未配置签名密钥时构建未签名产物；正式发布必须配置以下 secrets。
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify DMG contents
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmgs=(desktop/electron/release/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            printf 'expected exactly one DMG, got: %s\n' "${dmgs[*]}" >&2
            exit 1
          fi
          bash desktop/verify_macos_dmg.sh "${dmgs[0]}" "$ARCH"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: desktop/electron/release/*.dmg
          if-no-files-found: error

  # Windows 构建需要 P002b/P003b 的构建脚本。脚本落地前通过仓库变量
  # DESKTOP_WINDOWS_ENABLED=true 才启用，避免发布缺失平台的安装包。
  windows:
    name: Windows x64
    if: vars.DESKTOP_WINDOWS_ENABLED == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage bundled PostgreSQL 17 and pgvector
        run: powershell -ExecutionPolicy Bypass -File desktop/postgres/build_windows.ps1

      - name: Build PyInstaller sidecar
        run: powershell -ExecutionPolicy Bypass -File desktop/build_windows.ps1

      - name: Install Electron dependencies and compile
        working-directory: desktop/electron
        run: |
          npm ci
          npm run build

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $missing = @()
          if (-not $env:CSC_LINK) { $missing += 'WINDOWS_CSC_LINK' }
          if (-not $env:CSC_KEY_PASSWORD) { $missing += 'WINDOWS_CSC_KEY_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "桌面正式发布缺少 secret：$($missing -join ', ')"
          }

      - name: Package NSIS installer
        working-directory: desktop/electron
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Verify installer contents
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop/electron/release/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          & (Join-Path $env:GITHUB_WORKSPACE 'desktop\verify_windows_installer.ps1') -Installer $installer.FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: desktop/electron/release/*.exe
          if-no-files-found: error

  release:
    name: Publish desktop release
    # Windows 未启用时该 job 跳过，Release 仍按 macOS 产物发布；
    # 一旦启用，Windows 失败或未完成就不发布，避免半套安装包。
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/desktop-v') &&
      needs.macos.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          # 构建 artifact 各自带一份 SHA256SUMS.txt，合并后同名覆盖且不应进入发布校验和。
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          installers=(*.dmg *.exe)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::没有找到可发布的安装包"
            exit 1
          fi
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "CampusFlow Desktop ${TAG#desktop-}" \
            --notes-file docs/desktop/release-notes.md \
            --verify-tag
