name: Desktop Windows build

# 验证 P002b/P003b 的 Windows 构建脚本并产出未签名 NSIS 安装包（仅 artifact）。
# 正式发布仍由 desktop-release.yml 在 desktop-v* 标签上执行。
on:
  pull_request:
    paths:
      - "desktop/build_windows.ps1"
      - "desktop/postgres/**"
      - "desktop/campusflow-sidecar.spec"
      - "desktop/electron/**"
      - "frontend/**"
      - ".github/workflows/desktop-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage bundled PostgreSQL 17 and pgvector
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File desktop/postgres/build_windows.ps1

      - name: Build PyInstaller sidecar
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File desktop/build_windows.ps1

      - name: Smoke test bundled PostgreSQL, pgvector and sidecar
        shell: pwsh
        run: |
          $pg = 'desktop/vendor/pgsql'
          $scratch = Join-Path $env:RUNNER_TEMP 'pg-smoke'
          Remove-Item -Recurse -Force $scratch -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $port = 55440

          $alphabet = [char[]]((48..57) + (65..90) + (97..122))
          $password = -join (1..24 | ForEach-Object { Get-Random -InputObject $alphabet })
          $pwFile = Join-Path $scratch 'pw.txt'
          Set-Content -Path $pwFile -Value $password -NoNewline

          & "$pg\bin\initdb.exe" -D "$scratch\data" -U campusflow "--pwfile=$pwFile" -A scram-sha-256 -E UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & "$pg\bin\pg_ctl.exe" -D "$scratch\data" -l "$scratch\pg.log" -o "-p $port -h 127.0.0.1" -w start
          if ($LASTEXITCODE -ne 0) { Get-Content "$scratch\pg.log"; throw 'pg_ctl start failed' }
          try {
            $env:PGPASSWORD = $password
            & "$pg\bin\psql.exe" -h 127.0.0.1 -p $port -U campusflow -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE smoke'
            if ($LASTEXITCODE -ne 0) { throw 'CREATE DATABASE failed' }
            & "$pg\bin\psql.exe" -h 127.0.0.1 -p $port -U campusflow -d smoke -v ON_ERROR_STOP=1 `
              -c 'CREATE EXTENSION vector' `
              -c 'CREATE TABLE items (id bigserial, embedding vector(3))' `
              -c 'CREATE INDEX ON items USING hnsw (embedding vector_l2_ops)' `
              -c "INSERT INTO items (embedding) VALUES ('[1,2,3]'), ('[4,5,6]')" `
              -c "SELECT id FROM items ORDER BY embedding <-> '[3,1,2]' LIMIT 1"
            if ($LASTEXITCODE -ne 0) { throw 'pgvector smoke failed' }
          }
          finally {
            Remove-Item Env:\PGPASSWORD -ErrorAction SilentlyContinue
            & "$pg\bin\pg_ctl.exe" -D "$scratch\data" -m fast -w stop
          }
          Remove-Item -Recurse -Force $scratch -ErrorAction SilentlyContinue

          $sidecar = 'desktop/dist/campusflow-sidecar/campusflow-sidecar.exe'
          & $sidecar --version
          if ($LASTEXITCODE -ne 0) { throw 'sidecar --version failed' }

      - name: Install Electron dependencies and compile
        shell: pwsh
        working-directory: desktop/electron
        run: |
          npm ci
          npm run build

      - name: Package NSIS installer
        shell: pwsh
        working-directory: desktop/electron
        run: npx electron-builder --win --publish never

      - name: Verify artifacts
        shell: pwsh
        run: |
          $sidecar = 'desktop/dist/campusflow-sidecar/campusflow-sidecar.exe'
          if (-not (Test-Path $sidecar)) { throw "missing sidecar: $sidecar" }
          $pg = 'desktop/vendor/pgsql/bin/postgres.exe'
          if (-not (Test-Path $pg)) { throw "missing postgres: $pg" }
          $installer = Get-ChildItem 'desktop/electron/release/*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          $size = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "installer: $($installer.FullName) ($size MB)"
          Write-Host "sidecar: $sidecar"
          Write-Host "postgres: $pg"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-ci
          path: desktop/electron/release/*.exe
          if-no-files-found: error
