name: Desktop archive compatibility

# P012：验证 `.campusflow` 在 Windows 导出、macOS 导入后数据完整且一致。
# 只验证归档格式与导出/导入流程，不安装桌面应用、不涉及签名。
on:
  pull_request:
    paths:
      - "backend/src/campusflow/application/transfer/**"
      - "backend/src/campusflow/infrastructure/transfer/**"
      - "backend/src/campusflow/sidecar/**"
      - "backend/migrations/**"
      - "desktop/postgres/**"
      - ".github/workflows/desktop-archive-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-archive-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-export:
    name: Windows export
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Stage bundled PostgreSQL 17 and pgvector
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File desktop/postgres/build_windows.ps1

      - name: Build PyInstaller sidecar
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File desktop/build_windows.ps1

      - name: Bootstrap, seed and export archive
        shell: pwsh
        env:
          CAMPUSFLOW_DEPLOYMENT_MODE: desktop
          CAMPUSFLOW_DATA_DIR: ${{ runner.temp }}\campusflow-export
          CAMPUSFLOW_PG_BIN: ${{ github.workspace }}\desktop\vendor\pgsql\bin
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = Join-Path $env:GITHUB_WORKSPACE 'desktop\dist\campusflow-sidecar\campusflow-sidecar.exe'
          $staging = Join-Path $env:RUNNER_TEMP 'archive'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $archive = Join-Path $staging 'campusflow-from-windows.campusflow'

          $report = & $sidecar bootstrap --json
          if ($LASTEXITCODE -ne 0) { throw 'bootstrap failed' }
          $report | Set-Content -Path (Join-Path $staging 'bootstrap.json') -Encoding utf8
          $state = $report | ConvertFrom-Json
          if (-not $state.postgres_running) { throw 'PostgreSQL is not running after bootstrap' }

          $env:CAMPUSFLOW_DATABASE_URL = $state.database_url
          $psqlUrl = $state.database_url -replace 'postgresql\+psycopg://', 'postgresql://'
          $env:PGCLIENTENCODING = 'UTF8'
          & "$env:CAMPUSFLOW_PG_BIN\psql.exe" $psqlUrl -v ON_ERROR_STOP=1 `
            '--set=ws=desktop-transfer-check' `
            '--set=sem=2026 Fall' `
            '--set=course=Cross-OS Course' `
            '--set=code=CF101' `
            '--set=material_title=Cross-OS Material' `
            '--set=chunk_text=提交截止日期为2026年12月20日。' `
            '--set=task_title=Cross-OS Task' `
            '--set=candidate_title=Cross-OS Task Requirement' `
            -f desktop/postgres/seed_archive.sql
          if ($LASTEXITCODE -ne 0) { throw 'seeding failed' }

          $export = & $sidecar export --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'export failed' }
          $export | Set-Content -Path (Join-Path $staging 'export.json') -Encoding utf8
          $exported = $export | ConvertFrom-Json
          if (-not (Test-Path $archive)) { throw "archive missing: $archive" }
          foreach ($table in @('workspaces', 'semesters', 'courses', 'materials', 'material_versions', 'candidates', 'tasks', 'plans', 'time_blocks')) {
            if ($exported.counts.$table -ne 1) {
              throw "expected one $table row in export, got $($exported.counts.$table)"
            }
          }
          Write-Host "exported: $($exported.size) bytes, sha256 $($exported.sha256)"

          $info = & $sidecar import $archive --inspect
          if ($LASTEXITCODE -ne 0) { throw 'inspect failed' }
          $inspected = $info | ConvertFrom-Json
          if ($inspected.platform -notmatch 'Windows') {
            throw "unexpected archive platform: $($inspected.platform)"
          }
          Write-Host "inspect: format $($inspected.format_version), schema $($inspected.schema_head)"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: campusflow-windows-archive
          path: ${{ runner.temp }}/archive
          if-no-files-found: error

  macos-import:
    name: macOS import
    needs: windows-export
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Stage bundled PostgreSQL 17 and pgvector
        run: bash desktop/postgres/build_macos.sh

      - name: Build PyInstaller sidecar
        run: bash desktop/build_macos.sh

      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: campusflow-windows-archive
          path: ${{ runner.temp }}/archive

      - name: Import archive and verify data
        env:
          CAMPUSFLOW_DEPLOYMENT_MODE: desktop
          CAMPUSFLOW_DATA_DIR: ${{ runner.temp }}/campusflow-import
          CAMPUSFLOW_PG_BIN: ${{ github.workspace }}/desktop/vendor/pgsql/bin
        run: |
          set -euo pipefail
          sidecar="$GITHUB_WORKSPACE/desktop/dist/campusflow-sidecar/campusflow-sidecar"
          staging="$RUNNER_TEMP/archive"
          archive="$staging/campusflow-from-windows.campusflow"

          report=$("$sidecar" bootstrap --json)
          echo "$report" | jq -e '.postgres_running == true' >/dev/null
          export CAMPUSFLOW_DATABASE_URL
          CAMPUSFLOW_DATABASE_URL=$(echo "$report" | jq -r '.database_url')

          info=$("$sidecar" import "$archive" --inspect)
          echo "$info" | jq -e '.platform | startswith("Windows")' >/dev/null
          echo "$info" | jq -e '.format_version' >/dev/null
          token=$(echo "$info" | jq -r '.confirm_token')

          result=$("$sidecar" import "$archive" --replace --confirm-token "$token")
          echo "$result" | jq .
          echo "$result" > "$staging/import.json"

          for table in workspaces semesters courses materials material_versions candidates tasks plans time_blocks; do
            exported=$(jq -r --arg t "$table" '.counts[$t]' "$staging/export.json")
            restored=$(jq -r --arg t "$table" '.restored_counts[$t]' "$staging/import.json")
            if [ "$exported" != "$restored" ]; then
              echo "count mismatch for $table: exported $exported, restored $restored" >&2
              exit 1
            fi
          done

          psql_url="${CAMPUSFLOW_DATABASE_URL/postgresql+psycopg/postgresql}"
          q() {
            "$CAMPUSFLOW_PG_BIN/psql" "$psql_url" -v ON_ERROR_STOP=1 -tAc "$1"
          }
          workspace=$(q "SELECT name FROM workspaces WHERE name = 'desktop-transfer-check'")
          course=$(q "SELECT c.name FROM courses c JOIN semesters s ON s.id = c.semester_id WHERE s.name = '2026 Fall'")
          material=$(q "SELECT title FROM materials WHERE title = 'Cross-OS Material'")
          chunk=$(q "SELECT text FROM source_chunks WHERE text = '提交截止日期为2026年12月20日。'")
          task=$(q "SELECT title || '|' || progress FROM tasks WHERE title = 'Cross-OS Task'")
          candidate=$(q "SELECT f.value #>> '{}' FROM extracted_fields f JOIN extracted_items i ON i.id = f.candidate_id JOIN workspaces w ON w.id = i.workspace_id WHERE w.name = 'desktop-transfer-check' AND f.name = 'title'")
          evidence=$(q "SELECT e.quote FROM candidate_field_evidence e JOIN extracted_fields f ON f.id = e.field_id JOIN extracted_items i ON i.id = f.candidate_id JOIN workspaces w ON w.id = i.workspace_id WHERE w.name = 'desktop-transfer-check'")
          block=$(q "SELECT b.title || '|' || b.minutes || '|' || b.locked FROM plan_blocks b JOIN plan_drafts d ON d.id = b.draft_id JOIN workspaces w ON w.id = d.workspace_id WHERE w.name = 'desktop-transfer-check'")
          citation=$(q "SELECT t.citations->0->>'quote' FROM qa_turns t JOIN qa_conversations q ON q.id = t.conversation_id JOIN workspaces w ON w.id = q.workspace_id WHERE w.name = 'desktop-transfer-check'")

          check() {
            if [ "$2" != "$3" ]; then
              echo "$1 mismatch: expected '$3', got '$2'" >&2
              exit 1
            fi
          }
          check workspace "$workspace" "desktop-transfer-check"
          check course "$course" "Cross-OS Course"
          check material "$material" "Cross-OS Material"
          check chunk "$chunk" "提交截止日期为2026年12月20日。"
          check task "$task" "Cross-OS Task|in_progress"
          check candidate "$candidate" "Cross-OS Task Requirement"
          check evidence "$evidence" "提交截止日期为2026年12月20日。"
          check plan-block "$block" "Cross-OS Task|90|true"
          check citation "$citation" "提交截止日期为2026年12月20日。"
          echo "cross-platform archive verified: $workspace / $course / $task / $block"

  macos-export:
    name: macOS export
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Stage bundled PostgreSQL 17 and pgvector
        run: bash desktop/postgres/build_macos.sh

      - name: Build PyInstaller sidecar
        run: bash desktop/build_macos.sh

      - name: Bootstrap, seed and export archive
        env:
          CAMPUSFLOW_DEPLOYMENT_MODE: desktop
          CAMPUSFLOW_DATA_DIR: ${{ runner.temp }}/campusflow-export
          CAMPUSFLOW_PG_BIN: ${{ github.workspace }}/desktop/vendor/pgsql/bin
        run: |
          set -euo pipefail
          sidecar="$GITHUB_WORKSPACE/desktop/dist/campusflow-sidecar/campusflow-sidecar"
          staging="$RUNNER_TEMP/archive"
          mkdir -p "$staging"
          archive="$staging/campusflow-from-macos.campusflow"

          report=$("$sidecar" bootstrap --json)
          echo "$report" | jq -e '.postgres_running == true' >/dev/null
          export CAMPUSFLOW_DATABASE_URL
          CAMPUSFLOW_DATABASE_URL=$(echo "$report" | jq -r '.database_url')
          psql_url="${CAMPUSFLOW_DATABASE_URL/postgresql+psycopg/postgresql}"

          "$CAMPUSFLOW_PG_BIN/psql" "$psql_url" -v ON_ERROR_STOP=1 \
            --set=ws=reverse-transfer-check \
            --set=sem=2026 Fall \
            --set=course=Reverse OS Course \
            --set=code=CF102 \
            --set=material_title=Reverse OS Material \
            --set=chunk_text=反向验收：资料中的作业截止为2027年1月10日。 \
            --set=task_title=Reverse OS Task \
            --set=candidate_title=Reverse OS Task Requirement \
            -f desktop/postgres/seed_archive.sql

          exported=$("$sidecar" export --output "$archive")
          echo "$exported" > "$staging/export.json"
          echo "$exported" | jq -e '.counts.workspaces == 1 and .counts.semesters == 1 and .counts.courses == 1 and .counts.materials == 1 and .counts.material_versions == 1 and .counts.candidates == 1 and .counts.tasks == 1 and .counts.plans == 1 and .counts.time_blocks == 1' >/dev/null
          echo "$exported" | jq -e '.size > 0' >/dev/null

          info=$("$sidecar" import "$archive" --inspect)
          echo "$info" | jq -e '.platform | test("macOS|Darwin")' >/dev/null
          echo "exported from macOS: $(echo "$exported" | jq -r '.size') bytes"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: campusflow-macos-archive
          path: ${{ runner.temp }}/archive
          if-no-files-found: error

  windows-import:
    name: Windows import
    needs: macos-export
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Stage bundled PostgreSQL 17 and pgvector
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File desktop/postgres/build_windows.ps1

      - name: Build PyInstaller sidecar
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File desktop/build_windows.ps1

      - name: Download macOS archive
        uses: actions/download-artifact@v4
        with:
          name: campusflow-macos-archive
          path: ${{ runner.temp }}/archive

      - name: Import archive and verify data
        shell: pwsh
        env:
          CAMPUSFLOW_DEPLOYMENT_MODE: desktop
          CAMPUSFLOW_DATA_DIR: ${{ runner.temp }}\campusflow-import
          CAMPUSFLOW_PG_BIN: ${{ github.workspace }}\desktop\vendor\pgsql\bin
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = Join-Path $env:GITHUB_WORKSPACE 'desktop\dist\campusflow-sidecar\campusflow-sidecar.exe'
          $staging = Join-Path $env:RUNNER_TEMP 'archive'
          $archive = Join-Path $staging 'campusflow-from-macos.campusflow'

          $report = & $sidecar bootstrap --json
          if ($LASTEXITCODE -ne 0) { throw 'bootstrap failed' }
          $state = $report | ConvertFrom-Json
          if (-not $state.postgres_running) { throw 'PostgreSQL is not running after bootstrap' }
          $env:CAMPUSFLOW_DATABASE_URL = $state.database_url

          $info = & $sidecar import $archive --inspect
          if ($LASTEXITCODE -ne 0) { throw 'inspect failed' }
          $inspected = $info | ConvertFrom-Json
          if ($inspected.platform -notmatch 'macOS|Darwin') {
            throw "unexpected archive platform: $($inspected.platform)"
          }

          $result = & $sidecar import $archive --replace --confirm-token $inspected.confirm_token
          if ($LASTEXITCODE -ne 0) { throw 'import failed' }
          $result | Set-Content -Path (Join-Path $staging 'import.json') -Encoding utf8
          $restored = $result | ConvertFrom-Json
          $exported = Get-Content (Join-Path $staging 'export.json') -Raw | ConvertFrom-Json
          foreach ($table in @('workspaces', 'semesters', 'courses', 'materials', 'material_versions', 'candidates', 'tasks', 'plans', 'time_blocks')) {
            if ($exported.counts.$table -ne $restored.restored_counts.$table) {
              throw "count mismatch for ${table}: exported $($exported.counts.$table), restored $($restored.restored_counts.$table)"
            }
          }

          $psqlUrl = $state.database_url -replace 'postgresql\+psycopg://', 'postgresql://'
          $env:PGCLIENTENCODING = 'UTF8'
          function Invoke-Query([string]$sql) {
            $value = & "$env:CAMPUSFLOW_PG_BIN\psql.exe" $psqlUrl -v ON_ERROR_STOP=1 -tAc $sql
            if ($LASTEXITCODE -ne 0) { throw "query failed: $sql" }
            return $value.Trim()
          }
          function Assert-Value([string]$name, [string]$actual, [string]$expected) {
            if ($actual -ne $expected) {
              throw "${name} mismatch: expected '$expected', got '$actual'"
            }
          }
          $workspace = Invoke-Query "SELECT name FROM workspaces WHERE name = 'reverse-transfer-check'"
          $course = Invoke-Query "SELECT c.name FROM courses c JOIN semesters s ON s.id = c.semester_id WHERE s.name = '2026 Fall'"
          $material = Invoke-Query "SELECT title FROM materials WHERE title = 'Reverse OS Material'"
          $chunk = Invoke-Query "SELECT text FROM source_chunks WHERE text = '反向验收：资料中的作业截止为2027年1月10日。'"
          $task = Invoke-Query "SELECT title || '|' || progress FROM tasks WHERE title = 'Reverse OS Task'"
          $candidate = Invoke-Query "SELECT f.value #>> '{}' FROM extracted_fields f JOIN extracted_items i ON i.id = f.candidate_id JOIN workspaces w ON w.id = i.workspace_id WHERE w.name = 'reverse-transfer-check' AND f.name = 'title'"
          $evidence = Invoke-Query "SELECT e.quote FROM candidate_field_evidence e JOIN extracted_fields f ON f.id = e.field_id JOIN extracted_items i ON i.id = f.candidate_id JOIN workspaces w ON w.id = i.workspace_id WHERE w.name = 'reverse-transfer-check'"
          $block = Invoke-Query "SELECT b.title || '|' || b.minutes || '|' || b.locked FROM plan_blocks b JOIN plan_drafts d ON d.id = b.draft_id JOIN workspaces w ON w.id = d.workspace_id WHERE w.name = 'reverse-transfer-check'"
          $citation = Invoke-Query "SELECT t.citations->0->>'quote' FROM qa_turns t JOIN qa_conversations q ON q.id = t.conversation_id JOIN workspaces w ON w.id = q.workspace_id WHERE w.name = 'reverse-transfer-check'"

          Assert-Value workspace $workspace 'reverse-transfer-check'
          Assert-Value course $course 'Reverse OS Course'
          Assert-Value material $material 'Reverse OS Material'
          Assert-Value chunk $chunk '反向验收：资料中的作业截止为2027年1月10日。'
          Assert-Value task $task 'Reverse OS Task|in_progress'
          Assert-Value candidate $candidate 'Reverse OS Task Requirement'
          Assert-Value evidence $evidence '反向验收：资料中的作业截止为2027年1月10日。'
          Assert-Value plan-block $block 'Reverse OS Task|90|true'
          Assert-Value citation $citation '反向验收：资料中的作业截止为2027年1月10日。'
          Write-Host "reverse cross-platform archive verified: $workspace / $course / $task / $block"

