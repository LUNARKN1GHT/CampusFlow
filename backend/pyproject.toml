[project]
name = "campusflow-backend"
version = "0.1.0"
description = "CampusFlow Python API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "beautifulsoup4>=4.13,<5",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1.0",
    "pgvector>=0.4,<0.5",
    "pillow>=11,<14",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.8,<3.0",
    "pypdf>=5.0,<7.0",
    "pypdfium2>=5.0,<6.0",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.9,<1.0",
    "rq>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.20,<3.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campusflow"]

# 桌面 sidecar 不依赖仓库目录；迁移脚本与 Alembic 配置随 wheel 一起安装。
[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "campusflow/alembic.ini"
"migrations" = "campusflow/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
