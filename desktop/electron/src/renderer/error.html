<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusFlow · 启动失败</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2933;
        background: #fdf6f5;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { padding: 28px 32px; overflow: auto; }
      h1 { margin: 0 0 8px; font-size: 20px; color: #a61b1b; }
      .lead { margin: 0 0 18px; font-size: 13px; color: #616e7c; line-height: 1.6; }
      .stage { font-size: 13px; font-weight: 600; color: #323f4b; }
      .message {
        margin: 8px 0 16px;
        padding: 10px 12px;
        border-left: 3px solid #d64545;
        background: #fff;
        font-size: 13px;
        line-height: 1.6;
        word-break: break-word;
      }
      .path { font-size: 12px; color: #52606d; word-break: break-all; }
      pre {
        margin: 10px 0 18px;
        max-height: 160px;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 6px;
        background: #1f2933;
        color: #e4e7eb;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .actions { display: flex; gap: 10px; }
      button {
        border: 1px solid #cbd2d9;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        background: #fff;
        color: #1f2933;
      }
      button.primary { border-color: #2563eb; background: #2563eb; color: #fff; }
      button:disabled { opacity: 0.6; cursor: default; }
      .status { margin-top: 12px; font-size: 12px; color: #52606d; min-height: 16px; }
    </style>
  </head>
  <body data-testid="error">
    <h1>启动没有完成</h1>
    <p class="lead">
      应用已停止当前启动流程，没有打开空白页面。请根据下方阶段与日志排查，或点击“重试”重新启动。
    </p>
    <div class="stage" data-testid="error-stage">阶段：未知</div>
    <div class="message" data-testid="error-message">原因：未知</div>
    <div class="path">日志文件：<span data-testid="error-log-path">未知</span></div>
    <pre data-testid="error-log-tail"></pre>
    <div class="actions">
      <button type="button" class="primary" data-testid="retry">重试</button>
      <button type="button" data-testid="open-logs">打开日志目录</button>
    </div>
    <p class="status" data-testid="error-status"></p>
    <script src="./error.js"></script>
  </body>
</html>
