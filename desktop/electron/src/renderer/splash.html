<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusFlow</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2933;
        background: #f6f7f9;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 28px 32px;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      .brand { display: flex; align-items: baseline; gap: 10px; }
      .brand strong { font-size: 22px; letter-spacing: 0.2px; }
      .brand span { color: #616e7c; font-size: 13px; }
      .status { margin: 22px 0 10px; font-size: 14px; color: #323f4b; min-height: 20px; }
      .progress {
        position: relative;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e4e7eb;
      }
      .progress::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 35%;
        border-radius: inherit;
        background: #2563eb;
        animation: slide 1.3s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      .hint { margin-top: 18px; font-size: 12px; line-height: 1.6; color: #7b8794; }
      .stage { color: #52606d; }
    </style>
  </head>
  <body data-testid="splash">
    <div class="brand"><strong>CampusFlow</strong><span>校园学习事务智能助理</span></div>
    <p class="status" data-testid="splash-status">正在启动…</p>
    <div class="progress" aria-hidden="true"></div>
    <p class="hint">
      首次启动会初始化本地数据库与服务，可能需要稍候。<br />
      就绪后将自动打开主窗口。
    </p>
    <script src="./splash.js"></script>
  </body>
</html>
