  <p class="meta">发布单位：教务处 · 发布时间：2026-11-20 · 适用范围：全体本科在校生</p>
</header>
<main>
  <p>各教学单位、全体同学：</p>
  <p>2026 年秋季学期期末考试周定于 <strong>2026 年 12 月 19 日至 12 月 27 日</strong> 进行，各科目具体考试时间以任课教师通知为准。</p>
  <p>考试周期间，教学楼晚自习教室于 19:00 后停止开放，请同学们合理安排复习时间。</p>
  <p>申请缓考的同学请于 <strong>2026 年 12 月 10 日前</strong> 通过教务系统提交申请，并打印确认单交至学院教务办公室。</p>
</main>
